<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>Verifying</title>
        <style>
            :root {
                --bg: #f5f5f5;
                --text: #111;
                --surface: #ddd;
                --muted: #777;
                --link: #555;
                --error: #c00;
                --accent: {{ACCENT_COLOR}};
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0a0a0a;
                    --text: #e0e0e0;
                    --surface: #222;
                    --muted: #555;
                    --link: #777;
                    --error: #f55;
                }
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: system-ui, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background: var(--bg);
                color: var(--text);
            }
            .box {
                text-align: center;
                max-width: 420px;
                padding: 2rem;
            }
            h2 {
                margin-bottom: 1rem;
                font-weight: 500;
            }
            #status {
                color: var(--muted);
                margin-bottom: 1.5rem;
                font-size: 0.9rem;
            }
            .bar {
                width: 100%;
                height: 4px;
                background: var(--surface);
                border-radius: 2px;
                overflow: hidden;
            }
            .fill {
                height: 100%;
                background: var(--accent);
                width: 0;
                transition: width 0.3s;
            }
            noscript {
                color: var(--error);
                display: block;
                margin-top: 1rem;
            }
            .branding {
                margin-top: 1.5rem;
                font-size: 0.7rem;
                color: var(--muted);
            }
            .branding a {
                color: var(--link);
                text-decoration: none;
            }
            .branding a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <h2>Checking your browser</h2>
            <p id="status">Starting challenge&#8230;</p>
            <div class="bar"><div class="fill" id="bar"></div></div>
            <noscript>JavaScript is required.</noscript>
            {{BRANDING}}
        </div>
        <script>
{{include:sha256_miner.js}}
        </script>
        <script>
            (function () {
                var C = JSON.parse('{{CHALLENGE_DATA}}');
                var status = document.getElementById('status');
                var bar = document.getElementById('bar');
                var startedAt = Date.now();

                function onProgress(hashes) {
                    var seconds = Math.max((Date.now() - startedAt) / 1000, 0.1);
                    bar.style.width =
                        Math.min(95, (hashes / Math.pow(2, C.difficulty)) * 100) + '%';
                    status.textContent = 'Working\u2026 ' + Math.round(hashes / seconds) + ' H/s';
                }

                function onSolved(nonce) {
                    status.textContent = 'Verified!';
                    bar.style.width = '100%';
                    var form = document.createElement('form');
                    form.method = 'POST';
                    form.action = C.verifyPath;
                    [
                        ['id', C.id],
                        ['nonce', nonce],
                        ['redirect', C.redirect],
                    ].forEach(function (pair) {
                        var input = document.createElement('input');
                        input.type = 'hidden';
                        input.name = pair[0];
                        input.value = pair[1];
                        form.appendChild(input);
                    });
                    document.body.appendChild(form);
                    form.submit();
                }

                mineProof(C.data, C.difficulty, onProgress, onSolved);
            })();
        </script>
    </body>
</html>
