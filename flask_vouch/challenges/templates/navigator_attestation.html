<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>Verifying</title>
        <style>
            :root {
                --bg: #f5f5f5;
                --text: #111;
                --surface: #ddd;
                --muted: #777;
                --link: #555;
                --error: #c00;
                --accent: {{ACCENT_COLOR}};
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0a0a0a;
                    --text: #e0e0e0;
                    --surface: #222;
                    --muted: #555;
                    --link: #777;
                    --error: #f55;
                }
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: system-ui, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background: var(--bg);
                color: var(--text);
            }
            .box {
                text-align: center;
                max-width: 420px;
                padding: 2rem;
            }
            h2 {
                margin-bottom: 1rem;
                font-weight: 500;
            }
            #status {
                color: var(--muted);
                margin-bottom: 1.5rem;
                font-size: 0.9rem;
            }
            #rounds {
                color: var(--muted);
                font-size: 0.75rem;
                margin-top: 0.4rem;
            }
            .bar {
                width: 100%;
                height: 4px;
                background: var(--surface);
                border-radius: 2px;
                overflow: hidden;
            }
            .fill {
                height: 100%;
                background: var(--accent);
                width: 0;
                transition: width 0.3s;
            }
            noscript {
                color: var(--error);
                display: block;
                margin-top: 1rem;
            }
            .branding {
                margin-top: 1.5rem;
                font-size: 0.7rem;
                color: var(--muted);
            }
            .branding a {
                color: var(--link);
                text-decoration: none;
            }
            .branding a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <h2>Checking your browser</h2>
            <p id="status">Connecting&#8230;</p>
            <div class="bar"><div class="fill" id="bar"></div></div>
            <p id="rounds"></p>
            <noscript>JavaScript is required.</noscript>
            {{BRANDING}}
        </div>
        <script>
{{include:navigator_signals.js}}
        </script>
        <script>
            (function () {
                var C = JSON.parse('{{CHALLENGE_DATA}}');
                var bar = document.getElementById('bar');
                var rounds = document.getElementById('rounds');
                var status = document.getElementById('status');
                var wsOpened = false;

                function setProgress(current, total) {
                    bar.style.width = (current / total) * 100 + '%';
                    rounds.textContent = 'Round ' + current + ' of ' + total;
                }

                function setError(msg) {
                    status.textContent = msg;
                    status.style.color = 'var(--error)';
                }

                function finish(token) {
                    setProgress(1, 1);
                    status.textContent = 'Verified!';
                    var f = document.createElement('form');
                    f.method = 'POST';
                    f.action = C.verifyPath;
                    [
                        ['id', C.id],
                        ['nonce', token],
                        ['redirect', C.redirect],
                    ].forEach(function (p) {
                        var inp = document.createElement('input');
                        inp.type = 'hidden';
                        inp.name = p[0];
                        inp.value = p[1];
                        f.appendChild(inp);
                    });
                    document.body.appendChild(f);
                    f.submit();
                }

                function handleMsg(msg) {
                    if (msg.type === 'challenge') {
                        setProgress(msg.round, msg.totalRounds);
                        status.textContent =
                            'Collecting signals (' + msg.round + '/' + msg.totalRounds + ')\u2026';
                        return collectSignals(msg.checks);
                    }
                    if (msg.type === 'result') {
                        finish(msg.token);
                        return null;
                    }
                    if (msg.type === 'error') {
                        setError('Verification failed: ' + (msg.reason || 'unknown'));
                        return null;
                    }
                    return null;
                }

                function startPoll() {
                    status.textContent = 'Analyzing browser signals\u2026';
                    function step(body) {
                        fetch(C.verifyPath, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(body),
                        })
                            .then(function (r) {
                                return r.json();
                            })
                            .then(function (msg) {
                                var signals = handleMsg(msg);
                                if (signals && msg.type === 'challenge') {
                                    step({
                                        id: C.id,
                                        nonce: msg.nonce,
                                        round: msg.round,
                                        signals: signals,
                                    });
                                }
                            })
                            .catch(function () {
                                setError('Connection error');
                            });
                    }
                    step({ id: C.id, init: true });
                }

                if (typeof WebSocket === 'undefined') {
                    startPoll();
                    return;
                }

                var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
                var ws = new WebSocket(proto + '//' + location.host + C.verifyPath + '?id=' + C.id);

                ws.onopen = function () {
                    wsOpened = true;
                    status.textContent = 'Analyzing browser signals\u2026';
                };

                ws.onmessage = function (event) {
                    try {
                        var msg = JSON.parse(event.data);
                        var signals = handleMsg(msg);
                        if (signals && msg.type === 'challenge') {
                            ws.send(
                                JSON.stringify({
                                    nonce: msg.nonce,
                                    round: msg.round,
                                    signals: signals,
                                })
                            );
                        }
                    } catch (e) {
                        setError('Unexpected error');
                    }
                };

                ws.onerror = function () {
                    if (!wsOpened) startPoll();
                    else setError('Connection error');
                };
                ws.onclose = function (ev) {
                    if (ev.code >= 4000) setError('Session error (' + ev.code + ')');
                };
            })();
        </script>
    </body>
</html>
